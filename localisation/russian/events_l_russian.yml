l_russian:
oca.1.a: "Мы вынуждены отказать Азии в ее предложение"
oca.1.b: "Мы с радостью примем их предложение"
oca.1.d: "Сегодня с утра прибыл официальный посол из государства Азия.Его предложение состояло в том,что нашему государству будут переданы все территории бывшей голандской Ост-Индии,Калимантан и все прилежащие острова.С одной стороны это предложение пойдет на пользу нашей промышленности,но с другой стороны делает нас более зависимыми от Азии"
oca.1.t: "Передача ресурсов"
oca.2.t: "Права на ресурсы"
oca.2.a: "Конечно"
oca.2.desc: "После передачи ресурсов,Азиа требует передачи части ресурсов на острове Ява.Мы не можем отказать..."